name: Build FactoriOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@v3
        with:
          cache: true
          install: true

      - name: Download Factorio DMG
        run: |
          mkdir -p artifact
          curl -L "https://factorio.com/get-download/2.1.23/demo/osx" -o artifact/factorio_mac.dmg
          file artifact/factorio_mac.dmg

      - name: Build SDL3 and prepare game
        run: |
          mise run sdl3
          mise-tasks/prepare device

      - name: Build unsigned FactoriOS app
        run: |
          set -euo pipefail
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Using Xcode: $XCODE_26"
          sudo xcode-select -s "$XCODE_26/Contents/Developer"
          xcodebuild -version
          sed -i '' '/treatAllWarnings/d' Package.swift
          xtool dev generate-xcode-project
          xcodebuild \
            -workspace xtool/FactoriOS.xcworkspace \
            -scheme FactoriOS-App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath artifact/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            build

      - name: Embed game and package IPA
        run: |
          set -euo pipefail

          APP=$(find artifact xtool .build -name "FactoriOS-App.app" -type d | head -n 1)
          echo "Found app at: $APP"

          # Точные пути, которые создаёт prepare
          GAME_ROOT="artifact/game/FactoriOS"
          DYLIB="$GAME_ROOT/Converted/factorio.dylib"
          SLOTS="$GAME_ROOT/Converted/slots.json"
          GAME_DIR="$GAME_ROOT/Game"

          echo "Checking expected files:"
          ls -la "$DYLIB" || echo "DYLIB missing"
          ls -la "$SLOTS" || echo "SLOTS missing"
          ls -la "$GAME_DIR" || echo "GAME_DIR missing"

          if [ ! -f "$DYLIB" ] || [ ! -f "$SLOTS" ]; then
            echo "ERROR: expected files not found"
            echo "Contents of artifact/game:"
            find artifact/game -type f | head -50
            exit 1
          fi

          mkdir -p "$APP/Frameworks"
          cp "$DYLIB" "$APP/Frameworks/factorio.dylib"
          cp "$SLOTS" "$APP/Frameworks/factorio.slots.json"
          chmod 755 "$APP/Frameworks/factorio.dylib"

          if [ -d "$GAME_DIR" ]; then
            echo "Copying Game data"
            cp -R "$GAME_DIR" "$APP/Game"
          fi

          echo "--- Frameworks after copy ---"
          ls -la "$APP/Frameworks/"

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r FactoriOS-unsigned.ipa Payload

          echo "IPA created successfully"
          ls -lh FactoriOS-unsigned.ipa

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          release_name: FactoriOS IPA #${{ github.run_number }}
          draft: false
          prerelease: true
          body: |
            Unsigned IPA for Feather / sideloading.
            Built from commit ${{ github.sha }}

      - name: Upload IPA to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: FactoriOS-unsigned.ipa
          asset_name: FactoriOS-unsigned.ipa
          asset_content_type: application/octet-stream
