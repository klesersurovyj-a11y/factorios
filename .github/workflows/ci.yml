name: Build FactoriOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@v3
        with:
          cache: true
          install: true

      - name: Download Factorio DMG
        run: |
          mkdir -p artifact
          curl -L "https://factorio.com/get-download/2.1.23/demo/osx" -o artifact/factorio_mac.dmg
          file artifact/factorio_mac.dmg

      - name: Build SDL3 and prepare game
        run: |
          mise run sdl3
          mise-tasks/prepare device

      - name: Build unsigned FactoriOS app
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE_26/Contents/Developer"
          sed -i '' '/treatAllWarnings/d' Package.swift
          python3 -c '
          p1 = "Sources/FactoriOSRuntime/Game/AppEntry.swift"
          s1 = open(p1).read().replace("FOSSDLRunApp(CommandLine.argc, CommandLine.unsafeArgv) { _, _ in", "FOSSDLRunApp(CommandLine.argc, CommandLine.unsafeArgv) { (_: Int32, _: UnsafeMutablePointer<UnsafeMutablePointer<CChar>?>?) -> Int32 in")
          open(p1, "w").write(s1)

          p2 = "Sources/FactoriOSRuntime/Game/GameSession.swift"
          s2 = open(p2).read().replace("FOSCompatSetRestartHandler { arguments in", "FOSCompatSetRestartHandler { (arguments: UnsafePointer<CChar>?) -> Void in")
          open(p2, "w").write(s2)
          '
          xtool dev generate-xcode-project
          xcodebuild \
            -workspace xtool/FactoriOS.xcworkspace \
            -scheme FactoriOS-App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath artifact/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            build

      - name: Embed game and package IPA
        run: |
          APP=$(find artifact xtool .build -name "FactoriOS-App.app" -type d | head -n 1)
          echo "Found app at: $APP"
          GAME="artifact/game/FactoriOS"
          mkdir -p "$APP/Frameworks"
          cp "$GAME/Converted/factorio.dylib" "$APP/Frameworks/factorio.dylib"
          cp "$GAME/Converted/factorio.slots.json" "$APP/Frameworks/factorio.slots.json"
          chmod 755 "$APP/Frameworks/factorio.dylib"
          cp -R "$GAME/Game" "$APP/Game"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r FactoriOS-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FactoriOS-IPA
          path: FactoriOS-unsigned.ipa

