name: CI

on:
  # Every branch, so pushing one gives you an IPA to try.
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      factorio_url:
        description: Factorio for macOS .dmg to build in; empty uses the public demo
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint
    # macOS: clang-tidy and the iOS build need Xcode.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@v3
        with:
          cache: true
          install: false

      - name: Trust and install the toolchain
        run: |
          mise trust
          mise install

      - name: Lint
        run: mise run lint

  ipa:
    name: Sideloadable IPA
    # What deploy does on a Mac, in one app: the game, converted, inside the bundle (docs/sideloading.md).
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 120

    env:
      # The demo is public; a secret keeps your own copy's link out of the log.
      FACTORIO_URL: ${{ secrets.FACTORIO_URL || github.event.inputs.factorio_url || 'https://factorio.com/get-download/2.1.23/demo/osx' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@v3
        with:
          cache: true
          install: false

      - name: Trust and install the toolchain
        run: |
          mise trust
          mise install
          xcodebuild -version

      - name: Download Factorio
        run: |
          mkdir -p artifact
          curl -fL --retry 3 --retry-delay 5 "$FACTORIO_URL" -o artifact/factorio_mac.dmg
          file artifact/factorio_mac.dmg
          du -h artifact/factorio_mac.dmg

      - name: Build SDL3, import the game and convert it
        run: |
          mise run sdl3
          mise-tasks/prepare device

      - name: Build the app
        run: |
          xtool dev generate-xcode-project
          xcodebuild \
            -workspace xtool/FactoriOS.xcworkspace \
            -scheme FactoriOS-App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath artifact/DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Embed the game and package the IPA
        run: |
          set -eu
          app=artifact/DerivedData/Build/Products/Release-iphoneos/FactoriOS-App.app
          game=artifact/game/FactoriOS
          if [ ! -d "$app" ]; then
            echo "no app at $app; what the build made:"
            find artifact/DerivedData -maxdepth 8 -name '*.app'
            exit 1
          fi

          mkdir -p "$app/Frameworks"
          cp "$game/Converted/factorio.dylib" "$app/Frameworks/factorio.dylib"
          cp "$game/Converted/slots.json" "$app/Frameworks/factorio.slots.json"
          chmod 755 "$app/Frameworks/factorio.dylib"

          # Signed before the game data goes in: the data is not code, and the signing tool signs the app again.
          codesign --force --deep --sign - "$app"

          rm -rf "$app/Game"
          cp -R "$game/Game" "$app/Game"

          mkdir -p Payload
          cp -R "$app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload FactoriOS-sideload.ipa
          du -h FactoriOS-sideload.ipa
          plutil -extract version raw -o - "$app/Game/game.json"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: FactoriOS-ipa-${{ github.run_number }}
          path: FactoriOS-sideload.ipa
          if-no-files-found: error
          retention-days: 7
