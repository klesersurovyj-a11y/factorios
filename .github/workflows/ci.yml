name: Build FactoriOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      use_demo:
        description: 'Скачать бесплатную демоверсию вместо полной?'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@v3
        with:
          cache: true
          install: true

      - name: Download Factorio for macOS
        env:
          FACTORIO_URL: ${{ secrets.FACTORIO_URL }}
        run: |
          if [ "${{ inputs.use_demo }}" == "true" ]; then
            curl -L "https://factorio.com" -o factorio.dmg
          else
            curl -L "$FACTORIO_URL" -o factorio.dmg
          fi
          hdiutil attach factorio.dmg -mountpoint /Volumes/Factorio
          cp -R /Volumes/Factorio/factorio.app ./factorio.app
          hdiutil detach /Volumes/Factorio

      - name: Check available tasks and build
        run: |
          mise tasks
          mise run build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -name "FactoriOS.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r FactoriOS-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FactoriOS-IPA
          path: FactoriOS-unsigned.ipa

