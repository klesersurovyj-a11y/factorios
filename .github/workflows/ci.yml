name: Build FactoriOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@v3
        with:
          cache: true
          install: true

      - name: Download Factorio DMG
        run: |
          mkdir -p artifact
          curl -L "https://factorio.com/get-download/2.1.23/demo/osx" -o artifact/factorio_mac.dmg
          file artifact/factorio_mac.dmg

      - name: Build SDL3 and prepare game
        run: |
          mise run sdl3
          mise-tasks/prepare device

      - name: Build unsigned FactoriOS app
        run: |
          set -euo pipefail
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Using Xcode: $XCODE_26"
          sudo xcode-select -s "$XCODE_26/Contents/Developer"
          xcodebuild -version
          sed -i '' '/treatAllWarnings/d' Package.swift
          xtool dev generate-xcode-project
          xcodebuild \
            -workspace xtool/FactoriOS.xcworkspace \
            -scheme FactoriOS-App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath artifact/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            build

      - name: Embed game and package IPA
        run: |
          set -euo pipefail

          APP=$(find artifact xtool .build -name "FactoriOS-App.app" -type d | head -n 1)
          echo "Found app at: $APP"

          # Ищем dylib и slots
          DYLIB=$(find artifact -name "factorio.dylib" | head -n 1)
          SLOTS=$(find artifact -name "slots.json" -o -name "factorio.slots.json" | head -n 1)

          echo "Found dylib: $DYLIB"
          echo "Found slots: $SLOTS"

          if [ -z "$DYLIB" ] || [ -z "$SLOTS" ]; then
            echo "ERROR: missing game files"
            find artifact -type f \( -name "*.dylib" -o -name "*slots*" -o -name "*.json" \) | head -30
            exit 1
          fi

          mkdir -p "$APP/Frameworks"
          cp "$DYLIB" "$APP/Frameworks/factorio.dylib"
          cp "$SLOTS" "$APP/Frameworks/factorio.slots.json"
          chmod 755 "$APP/Frameworks/factorio.dylib"

          # Копируем данные игры, если есть
          GAME_DIR=$(find artifact -type d -path "*/Game" | head -n 1)
          if [ -n "$GAME_DIR" ]; then
            echo "Copying Game data from $GAME_DIR"
            cp -R "$GAME_DIR" "$APP/Game"
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r FactoriOS-unsigned.ipa Payload

          echo "IPA created"
          ls -lh FactoriOS-unsigned.ipa
          echo "--- Contents of Frameworks ---"
          ls -la "$APP/Frameworks/" || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FactoriOS-IPA
          path: FactoriOS-unsigned.ipa
          set -euo pipefail
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Using
