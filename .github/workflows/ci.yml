name: Build FactoriOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@v3
        with:
          cache: true
          install: true

      - name: Download Factorio Demo DMG
        run: |
          mkdir -p artifact
          curl -L -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" "https://factorio.com" -o artifact/factorio.dmg
          ls -lh artifact/factorio.dmg
          file artifact/factorio.dmg

      - name: Check tasks and build
        run: |
          mise tasks
          mise run build

      - name: Package IPA
        run: |
          mkdir -p Payload
          find . -maxdepth 5 -not -path '*/.*' -o -path './.build*' -o -path './.xtool*' | grep -i "\.app$" || true
          APP_PATH=$(find . -name "*.app" -type d | grep -iv "factorio.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found, checking build outputs:"
            find . -maxdepth 4 -type f -perm +111 | grep -iv "\.git"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r FactoriOS-unsigned.ipa Payload



      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FactoriOS-IPA
          path: FactoriOS-unsigned.ipa
