# Toolchain and tasks, for macOS with Xcode. Per-machine overrides (device, team, game, bundle ID) go in the uncommitted
# mise.local.toml.
[tools]
swift = "6.4.2"
swiftlint = "0.65.1"
shellcheck = "0.11.0"
"github:cpp-linter/clang-tools-static-binaries" = { version = "2026.09.01-5fb8802d", matching = "clang-tidy-23_", format = "raw", bin = "clang-tidy" }

[tools."github:xtool-org/xtool"]
version = "1.24.0"
asset_pattern = "xtool.app.zip"
bin_path = "xtool.app/Contents/Resources/bin"

[tasks.lint]
description = "Lint Swift, Objective-C, scripts and property lists"
run = [
  "swiftlint lint --strict --quiet",
  "swift format lint --strict --recursive --parallel Package.swift Sources",
  "shellcheck mise-tasks/*",
  "plutil -lint -s Resources/*.plist Resources/*.entitlements",
  'clang-tidy --quiet Sources/FactoriOSCompat/*.m -- --target=arm64-apple-ios17.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -fobjc-arc -fmodules -ISources/FactoriOSCompat/include',
]

[tasks.build]
description = "Build the converter and the iOS targets for devices and the simulator"
depends = ["sdl3"]
run = [
  "swift build --product factorios-convert",
  'swift build --target FactoriOSRuntime --triple arm64-apple-ios17.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"',
  'swift build --target FactoriOSRuntime --triple arm64-apple-ios17.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"',
]

[tasks.format]
description = "Format Swift sources"
run = "swift format format --in-place --recursive --parallel Package.swift Sources"
