# Toolchain and tasks, for macOS with Xcode. Per-machine values (device, team, game, bundle ID) live in the uncommitted mise.local.toml,
# written by `mise run setup`.
[tools]
swift = "6.4.2"
swiftlint = "0.65.1"
python = "3.12"
uv = "0.13.7"
"pipx:clang-tidy" = "23.1.4"
"github:jdx/jactionlint" = "2.5.0"
shellcheck = "0.11.0"

[tools."github:xtool-org/xtool"]
version = "1.24.0"
asset_pattern = "xtool.app.zip"
bin_path = "xtool.app/Contents/Resources/bin"

[tasks.setup]
description = "Find your device, team and Factorio disk image"
run = "python3 scripts/setup"

[tasks.deploy]
description = "Build, install and launch FactoriOS with the game on your device"
depends = ["xcode-project"]
run = "scripts/deploy"

[tasks.simulator]
description = "Launch the launcher in the iOS Simulator"
depends = ["xcode-project"]
run = "scripts/simulator"

[tasks.lint]
description = "Lint Swift, Objective-C, scripts, workflows and the compatibility map"
run = """
set -e
swiftlint lint --strict --quiet
swift format lint --strict --recursive --parallel Package.swift Sources
python3 scripts/check-architecture
jactionlint
shellcheck scripts/deploy scripts/simulator scripts/prepare-sdl3.sh
PYTHONPYCACHEPREFIX="${TMPDIR:-/tmp}/factorios-pycache" python3 -m py_compile scripts/setup scripts/check-architecture
plutil -lint -s Resources/*.plist Resources/*.entitlements
clang-tidy --quiet Sources/FactoriOSCompat/*.m -- \
  -x objective-c -fobjc-arc -fblocks -fmodules \
  -fmodules-cache-path="${TMPDIR:-/tmp}/factorios-clang-modules" \
  -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
  -target arm64-apple-ios17.0 \
  -ISources/FactoriOSCompat/include
"""

[tasks.build]
description = "Build the converter and the iOS targets for devices and the simulator"
run = """
set -e
FACTORIOS_CORE_ONLY=1 swift build
scripts/prepare-sdl3.sh
for sdk in iphoneos iphonesimulator; do
  triple=arm64-apple-ios17.0
  [ "$sdk" = iphonesimulator ] && triple="$triple-simulator"
  swift build --triple "$triple" --sdk "$(xcrun --sdk "$sdk" --show-sdk-path)" --target FactoriOSRuntime
done
"""

[tasks.format]
description = "Format Swift sources"
run = "swift format format --in-place --recursive --parallel Package.swift Sources"

[tasks.xcode-project]
description = "Build SDL3 if needed and generate xtool/FactoriOS.xcworkspace"
run = ["scripts/prepare-sdl3.sh", "xtool dev generate-xcode-project"]
