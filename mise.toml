# Shared toolchain for FactoriOS. Machine-specific additions go in mise.local.toml (not committed).
[tools]
swift = "6.4.2"
swiftlint = "0.65.1"
python = "3.12"
uv = "0.13.7"
"aqua:ip7z/7zip" = "26.05"
"pipx:clang-tidy" = "23.1.4"
"github:jdx/jactionlint" = "2.5.0"
shellcheck = "0.11.0"

[tools."github:xtool-org/xtool"]
version = "1.24.0"

[tools."github:xtool-org/xtool".platforms]
linux-arm64 = { asset_pattern = "xtool-aarch64.AppImage", format = "raw", bin = "xtool" }
linux-x64 = { asset_pattern = "xtool-x86_64.AppImage", format = "raw", bin = "xtool" }
macos-arm64 = { asset_pattern = "xtool.app.zip", bin_path = "xtool.app/Contents/Resources/bin" }
macos-x64 = { asset_pattern = "xtool.app.zip", bin_path = "xtool.app/Contents/Resources/bin" }

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
hide = true
description = "Python packages for binary inspection"
run = "uv pip install --quiet --requirement scripts/requirements.txt"

[tasks.inspect]
description = "Feasibility report for a Factorio macOS build ($FACTORIOS_DMG or the path given)"
depends = ["setup"]
run = "python3 scripts/inspect-binary"

[tasks.lint]
hide = true
description = "SwiftLint, strict"
run = "swiftlint lint --strict --quiet"

[tasks.format-check]
hide = true
description = "swift-format, strict"
run = "swift format lint --strict --recursive --parallel Package.swift Sources"

[tasks.format]
description = "Rewrites sources with swift-format"
run = "swift format format --in-place --recursive --parallel Package.swift Sources"

[tasks.build-host]
hide = true
description = "Compiles the platform-independent target on this machine (no run)"
env = { FACTORIOS_CORE_ONLY = "1" }
run = "swift build --target FactoriOSCore"

[tasks.tidy]
hide = true
description = "clang-tidy over Objective-C (requires Xcode's iOS SDK)"
run = """
clang-tidy --quiet Sources/FactoriOSCompat/*.m -- \
  -x objective-c -fobjc-arc -fblocks -fmodules \
  -fmodules-cache-path="${TMPDIR:-/tmp}/factorios-clang-modules" \
  -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
  -target arm64-apple-ios17.0 \
  -ISources/FactoriOSCompat/include
"""

[tasks.check-architecture]
hide = true
description = "Every file and API listed in docs/architecture.md exists"
run = "python3 scripts/check-architecture"

[tasks.check-repo]
hide = true
description = "Checks workflows, scripts and property lists"
run = """
jactionlint
shellcheck scripts/prepare-sdl3.sh
PYTHONPYCACHEPREFIX="${TMPDIR:-/tmp}/factorios-pycache" python3 -m py_compile scripts/inspect-binary
python3 - <<'PY'
import pathlib
import plistlib

for path in (
    pathlib.Path("Resources/Info.plist"),
    pathlib.Path("Resources/FactoriOS.entitlements"),
    pathlib.Path("Resources/FactoriOS.memory.entitlements"),
):
    with path.open("rb") as file:
        plistlib.load(file)
PY
"""

[tasks.check]
description = "Every portable build and static check"
depends = ["lint", "format-check", "build-host", "check-architecture", "check-repo"]

[tasks.prepare-sdl3]
hide = true
description = "Downloads and verifies SDL's official Apple XCFramework"
run = "scripts/prepare-sdl3.sh"

[tasks.build-ios]
hide = true
description = "Compiles every iOS target"
depends = ["prepare-sdl3"]
run = """
swift build \
  --triple arm64-apple-ios17.0 \
  --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
  --target FactoriOSApp
"""

[tasks.build-ios-simulator]
hide = true
description = "Compiles every iOS target for the simulator"
depends = ["prepare-sdl3"]
run = """
swift build \
  --triple arm64-apple-ios17.0-simulator \
  --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
  --target FactoriOSApp
"""

[tasks.check-ios]
description = "Analyzes Objective-C and compiles every target for devices and the simulator"
depends = ["tidy", "build-ios", "build-ios-simulator"]

[tasks.dev]
description = "Prepares SDL, then builds and installs with xtool"
depends = ["prepare-sdl3"]
run = "xtool dev"

[tasks.xcode-project]
description = "Prepares SDL, then generates the Xcode workspace"
depends = ["prepare-sdl3"]
run = "xtool dev generate-xcode-project"

[tasks.build-simulator]
description = "Builds the generated app for the configured iOS Simulator"
depends = ["xcode-project"]
run = """
xcodebuild \
  -workspace xtool/FactoriOS.xcworkspace \
  -scheme FactoriOS-App \
  -configuration Debug \
  -destination "platform=iOS Simulator,id=${FACTORIOS_SIMULATOR_ID:?set FACTORIOS_SIMULATOR_ID in mise.local.toml}" \
  -derivedDataPath "${FACTORIOS_DERIVED_DATA:-artifact/DerivedData}" \
  CODE_SIGNING_ALLOWED=NO \
  build
"""

[tasks.simulator]
description = "Builds, installs and launches the app in the configured iOS Simulator"
depends = ["build-simulator"]
run = """
simulator_id="${FACTORIOS_SIMULATOR_ID:?set FACTORIOS_SIMULATOR_ID in mise.local.toml}"
derived_data="${FACTORIOS_DERIVED_DATA:-artifact/DerivedData}"
xcrun simctl boot "$simulator_id" 2>/dev/null || true
xcrun simctl bootstatus "$simulator_id" -b
xcrun simctl install "$simulator_id" "$derived_data/Build/Products/Debug-iphonesimulator/FactoriOS-App.app"
xcrun simctl launch "$simulator_id" app.factorios
"""
